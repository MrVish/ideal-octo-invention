name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  setup-and-build:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ["22", "23.11.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm install
      - name: Create .env
        run: node -e "require('fs').copyFileSync('.env.example', '.env')"
      - name: Setup database (npm run setup)
        run: npm run setup
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
